[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "geopose"
version = "1.0.0"
description = "Reproducible GeoPose training, calibration, refinement, and test-time optimization"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Rudolf L. M. van Herten" },
  { name = "Robert Graf" },
  { name = "Felix Bitzer" },
  { name = "Jan S. Kirschke" },
  { name = "Johannes C. Paetzold" },
]
keywords = ["medical imaging", "pose estimation", "angiography", "differentiable rendering"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.13,<3.14"
dependencies = [
  "bilateralfilter-torch==1.1.0",
  "diffdrr==0.6.0",
  "fireants==1.4.0",
  "HD-BET==2.0.1",
  "hydra-core==1.3.2",
  "kornia==0.8.1",
  "matplotlib==3.10.6",
  "monai==1.5.1",
  "nibabel==5.3.2",
  "numpy==2.1.2",
  "omegaconf==2.3.0",
  "opencv-python==4.12.0.88",
  "pytorch-lightning==2.6.1",
  "pytorch3d @ git+https://github.com/facebookresearch/pytorch3d.git@2d4d345b6fd2720580bff5f63dcbd3b230b43996",
  "scikit-image==0.25.2",
  "scipy==1.15.3",
  "SimpleITK==2.5.2",
  "timm==1.0.21",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "tqdm==4.67.1",
  "wandb==0.25.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[project.urls]
Repository = "https://github.com/RoelvH97/GeoPose"
Issues = "https://github.com/RoelvH97/GeoPose/issues"
GeoReg = "https://github.com/RoelvH97/GeoReg"

[project.scripts]
geopose-preregister = "geopose.cli.preregister:main"
geopose-train = "geopose.cli.train:main"
geopose-test = "geopose.cli.test:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geopose = ["configs/*.yaml", "assets/*.json", "artifacts/*.json", "examples/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires optional release artifacts, private data, or CUDA"]
