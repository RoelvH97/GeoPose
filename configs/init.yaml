data:
  dataset: cta
  data_root: null
  dsa_root: null
  align_suffix: alignedv2
  max_subjects: null
  device: cuda
  epoch_len: 100
  batch_size: 4
  split_file: null
  train_fraction: 0.7
  val_fraction: 0.15
  num_workers: 0
  seed: 42
  drr:
    sdd: 1020
    height: 256
    delx: 1.2
    labels:
    - 0
    - 1
    - 2
    - 3
    - 4
    stop_gradients: true
  fiducials:
    enabled: true
    labels:
    - 1
    - 2
    max_points: 128
    cache_dir: ${data.data_root}/carotis_skeleton_cache
  augmentation:
    p: 0.333
    max_crop: 10
    drr_clahe_clip:
    - 1.0
    - 10.0
    drr_gamma_range:
    - 0.7
    - 1.8
    drr_noise_std: 0.1
    use_plasma: true
    plasma_roughness:
    - 0.1
    - 0.5
    plasma_brightness_intensity:
    - -1.0
    - 1.0
    plasma_p: 1.0
    map_bilateral_sigma_min: 1
    map_bilateral_sigma_max: 15
    map_bilateral_val_sigma: 11.0
    map_affine_max_angle_deg: 10.0
    map_affine_max_translate: 0.5
    map_affine_scale_min: 0.9
    map_affine_scale_max: 1.1
    lateral_flip_p: 0.5
    map_consistency: false
  pose:
    t_std: 25.0
    t_y_std: 75.0
    t_y_offset: 650.0
    r_std: 0.2
    lateral_prob: 0.5
    parameterization: euler_angles
    convention: ZYX
model:
  backbone: resnet34
  num_outputs: 6
  pretrained: true
  init_net_ckpt: null
  freeze_net1: false
  optimizer:
    _target_: torch.optim.AdamW
    lr: 0.00015
    weight_decay: 1.0e-05
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  lambda1: 0.01
  lambda2: 0.01
  lambda_dice: 0.1
  lambda_proj: 0.1
  dice_anneal: false
  lambda_mvc: 0.0
  lambda_da: 0.0
  lambda_map_ncc: 0.0
  lambda_map_r0: 0.0
  lambda_view_cls: 0.0
  lambda_view_cls_drr: 1.0
  lambda_view_cls_map: 0.0
  view_cls_drr_anneal: true
  da_alpha: 1.0
  da_gamma: 10.0
  parameterization: euler_angles
  convention: ZYX
  view_anchor: true
  dsa_view_anchor_mode: known_role_predicted_side
  view_role_emb_dim: 16
  view_role_emb_classes: 3
  ncc:
    _target_: diffdrr.metrics.MultiscaleNormalizedCrossCorrelation2d
    patch_sizes:
    - 13
    - null
    patch_weights:
    - 0.5
    - 0.5
  log_se3:
    _target_: diffdrr.metrics.LogGeodesicSE3
  geo_se3:
    _target_: diffdrr.metrics.DoubleGeodesicSE3
    sdd: 1020
  dice:
    _target_: geopose.models.losses.SoftCarotidDiceLoss
    k: 5.0
  ema:
    enabled: false
    decay: 0.999
    lambda_log: 0.01
    lambda_double: 0.01
    anneal: false
    dsa:
      enabled: false
      lambda_log: 0.01
      lambda_double: 0.01
      anneal: false
  refine:
    enabled: false
    init_ckpt: null
    freeze: false
    architecture: early_fusion
    backbone: resnet18
    pretrained: true
    view_classes: 3
    view_emb_dim: 16
    conv1_init: repeat
    delta_R_scale:
    - 0.1
    - 0.07
    - 0.12
    delta_t_scale:
    - 4.0
    - 30.0
    - 4.0
    lambda_ncc: 1.0
    lambda_dice: 1.0
    lambda_proj: 0.0
    lambda_geo_log: 0.01
    lambda_geo_double: 0.01
    anneal: false
  n_log_patients: 4
  log_images_every_n_train_epochs: 10
trainer:
  max_epochs: 400
  accelerator: auto
  devices: 1
  log_dir: null
  accumulate_grad_batches: 8
wandb:
  project: GeoPose
  entity: qurai
  name: geopose-single-role-emb-signed-predside-dice-mpd-splitv1
  tags:
  - single-view
  - role-embedding
  - signed-role
  - view-anchor
  - predicted-lat-side
  - alignedv2
  - dice
  - mpd
  - split-v1
  watch_model: false
release_contract:
